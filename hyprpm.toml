[repository]
name = "hyprtail"
authors = ["Abhishek Mallepalli"]
# [hyprland commit, hyprtail commit]: when the running Hyprland is exactly
# that commit, hyprpm builds that hyprtail commit instead of the latest.
# None needed while master builds against both the pinned Hyprland (the
# Makefile's HYPRLAND_PIN, plugin API 0.1) and Hyprland main (plugin API 0.2):
# src/compat.hpp adapts to the headers hyprpm built, and PLUGIN_API_VERSION
# reports theirs.
commit_pins = []

[hyprtail]
description = "Cursor trail with a user-programmable ribbon shader"
authors = ["Abhishek Mallepalli"]
output = "out/hyprtail.so"
build = [
    "make all",
]
