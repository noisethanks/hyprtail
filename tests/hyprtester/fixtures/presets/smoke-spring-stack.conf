# Smoke test fixture (tests/hyprtester/hyprtail_smoke.cpp). Copied into the
# scratch hyprtail root with ../shaders; every one has a layer named "trail".
contract = 2
description = smoke fixture: path, quad and instanced layers over a spring chain
layers = trail, idle, sparks
source = spring
source:damping_ratio = 0.8
source:capacity = 48
trail:vertex = shaders/smoke-path.vert
trail:fragment = shaders/smoke.frag
idle:vertex = shaders/smoke-quad.vert
idle:fragment = shaders/smoke.frag
idle:start_ms = 50
idle:duration_ms = 200
sparks:vertex = shaders/smoke-instanced.vert
sparks:fragment = shaders/smoke.frag
