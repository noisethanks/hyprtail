# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# doc: scales:fade_ms scales:width scales:cell_px scales:dissolve
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Hexagonal cells that dissolve one by one along the path
layers      = scales

# source
source:min_spacing = 2    # smallest move that adds a point, px
source:max_spacing = 8    # largest gap between points, px; lower = smoother curves
source:warp_speed  = 4    # how fast a warp is drawn, px/ms
source:warp_max_ms = 250  # longest a warp takes to draw, ms
source:warp_p1     = 0,0  # warp easing curve, first control point x,y
source:warp_p2     = 1,1  # warp easing curve, second control point x,y

# scales
scales:vertex     = builtin:taper.vert
scales:fragment   = builtin:hexagons.frag
scales:fade_ms    = 800             # tail length, ms
scales:width      = 36              # trail thickness at the head, px
scales:tail_power = 0.7
scales:cell_px    = 9               # cell length along the trail, px
scales:rows       = 4               #! cells across; keep cell_px = width / rows for regular hexagons
scales:gap        = 0.16
scales:dissolve   = 0.85            # fade style: 0 = all at once, 1 = cell by cell
scales:shimmer    = 0.35
scales:shimmer_hz = 0.4
scales:alpha      = 0.7
scales:color_a    = rgba(7a9a86ff)  #! sage cells
scales:color_b    = rgba(6f879fff)  #! slate-blue cells
