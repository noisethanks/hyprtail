# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

#! The head is a loose spring: when the pointer stops it swings past and
#! back a few times, dying out in about half a second. The stiffer rope
#! carries the swing down its length as a shrinking wave. While dragging,
#! the tail lags about half a second. Visible points: fade_ms / age_step_ms.

# variant: source:head_damping_ratio=0.2 source:freq_hz=30 | Livelier, longer rope
# doc: source:capacity source:freq_hz source:damping_ratio
# doc: source:head_freq_hz source:head_damping_ratio source:age_step_ms
# doc: trail:fade_ms trail:width trail:speed_ref

contract    = 2
description = A springy rope of points chasing the pointer
layers      = trail
source      = spring

# source
source:capacity           = 64   # rope length, points
source:freq_hz            = 40   # rope stiffness, Hz; lower = lazier rope, longer lag
source:damping_ratio      = 0.9  # rope bounce: 1 = none, lower = more wobble
source:head_freq_hz       = 4    # head stiffness, Hz; lower = slower, wider swings
source:head_damping_ratio = 0.3  # head bounce: lower = more swings
source:age_step_ms        = 10   # tail fade per point, ms; higher = shorter tail

# trail
trail:vertex      = builtin:taper.vert
trail:fragment    = builtin:gradient.frag
trail:fade_ms     = 640         # tail length, ms
trail:width       = 6           # trail thickness at the head, px
trail:miter_limit = 2
trail:speed_ref   = 3           # speed for full color_b, px/ms; lower = flares sooner
trail:color_a     = 0xff7a5cff  #! slow: violet
trail:color_b     = 0xffff9ad5  #! fast: pink
