# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# variant: crackle:duration_ms=8000 | Crackle stops after 8 s instead of redrawing until the pointer moves
# variant: crackle:enabled=false | No crackle
# doc: embers:fade_ms embers:count embers:gravity
# doc: crackle:start_ms crackle:duration_ms
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Rising embers that cool as they drift, electric crackle idle effect
layers      = embers, crackle

# source
source:min_spacing = 2    # smallest move that adds a point, px
source:max_spacing = 8    # largest gap between points, px; lower = smoother curves
source:warp_speed  = 7    # how fast a warp is drawn, px/ms
source:warp_max_ms = 250  # longest a warp takes to draw, ms
source:warp_p1     = 0,0  # warp easing curve, first control point x,y
source:warp_p2     = 1,1  # warp easing curve, second control point x,y

# embers
embers:vertex      = builtin:drift.vert
embers:fragment    = builtin:dots.frag
embers:fade_ms     = 500         # particle lifetime, ms
embers:count       = 60          # particles per trail point; higher = denser
embers:size        = 2.2
embers:speed       = 18
embers:wobble      = 50
embers:trailing    = 0.15
embers:gravity     = 60          # rise or fall strength, px/s^2; 0 = drift freely
embers:gravity_dir = 0,-1
embers:softness    = 0.9
embers:twinkle     = 0.4
embers:twinkle_hz  = 5
embers:color_by    = 1
embers:color_a     = 0xffffd580  #! hot, newborn
embers:color_b     = 0xffff3a00  #! cool, fading

# crackle
crackle:vertex      = builtin:halo.vert
crackle:fragment    = builtin:sizzle.frag
crackle:start_ms    = 600         # how long the pointer rests before the effect shows, ms
crackle:duration_ms = 0           # how long the effect shows, ms; 0 = until the pointer moves
crackle:radius      = 55
crackle:arcs        = 4
crackle:interval_ms = 900
crackle:crackle_ms  = 160
crackle:chance      = 0.6
crackle:thickness   = 1.5
crackle:color_a     = 0xfffff0c0  #! spark near the pointer
crackle:color_b     = 0xffff5a1a  #! spark tips
