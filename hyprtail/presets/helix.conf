# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# doc: sheath:fade_ms sheath:width
# doc: strands:fade_ms strands:width strands:pitch_px strands:spin strands:rungs_per_turn
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Twin-strand helix with rungs
layers      = sheath, strands

# source
source:min_spacing = 2    # smallest move that adds a point, px
source:max_spacing = 8    # largest gap between points, px; lower = smoother curves
source:warp_speed  = 4    # how fast a warp is drawn, px/ms
source:warp_max_ms = 250  # longest a warp takes to draw, ms
source:warp_p1     = 0,0  # warp easing curve, first control point x,y
source:warp_p2     = 1,1  # warp easing curve, second control point x,y

# sheath
sheath:vertex   = builtin:convex.vert
sheath:fragment = builtin:gradient.frag
sheath:color_by = 1
sheath:fade_ms  = 700             # tail length, ms
sheath:width    = 26              # ribbon thickness at its widest, px
sheath:head_ms  = 200
sheath:softness = 1
sheath:alpha    = 0.07
sheath:color_a  = rgba(8f7fa8ff)  #! lavender haze
sheath:color_b  = rgba(8f7fa8ff)  #! same lavender: the haze never shifts

# strands
strands:vertex         = builtin:convex.vert
strands:fragment       = builtin:strands.frag
strands:fade_ms        = 700             # tail length, ms
strands:width          = 26              # ribbon thickness at its widest, px
strands:head_ms        = 200
strands:tail_curve     = 0.8
strands:pitch_px       = 38              # length of one twist, px
strands:amp            = 0.6
strands:strand_px      = 1.2
strands:spin           = 1.2             # twist speed, rad/s; negative reverses
strands:depth          = 0.5
strands:rungs_per_turn = 2               # rungs per twist; 0 = none
strands:rung_alpha     = 0.25
strands:alpha          = 0.75
strands:color_a        = rgba(8f7fa8ff)  #! lavender strand
strands:color_b        = rgba(6f879fff)  #! slate-blue strand
