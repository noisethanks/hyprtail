# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# variant: idle:enabled=true | Pulse at the cursor while it rests
# doc: ink:fade_ms ink:width ink:nib ink:nib_angle
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Calligraphy pen stroke that swells and thins with direction
layers      = ink, idle

# source
source:min_spacing = 2    # smallest move that adds a point, px
source:max_spacing = 8    # largest gap between points, px; lower = smoother curves
source:warp_speed  = 4    # how fast a warp is drawn, px/ms
source:warp_max_ms = 250  # longest a warp takes to draw, ms
source:warp_p1     = 0,0  # warp easing curve, first control point x,y
source:warp_p2     = 1,1  # warp easing curve, second control point x,y

# ink
ink:vertex      = builtin:taper.vert
ink:fragment    = builtin:gradient.frag
ink:fade_ms     = 420         # tail length, ms
ink:width       = 7           # trail thickness at the head, px
ink:miter_limit = 2
ink:taper       = 0.6
ink:nib         = 0.85        # pen shape: 0 = round, 1 = flat nib with thick and thin strokes
ink:nib_angle   = 45          # flat nib angle from horizontal, degrees
ink:color_by    = 1
ink:color_a     = 0xfff4efe6  #! fresh ink: warm white
ink:color_b     = 0xff7d8ea3  #! dried ink: slate gray

# idle
idle:vertex                  = builtin:halo.vert
idle:fragment                = builtin:pulse.frag
idle:enabled                 = false
idle:start_ms                = 500
idle:duration_ms             = 1500
idle:radius                  = 24
idle:draw_when_cursor_hidden = false
idle:color_a                 = 0xff1a66ff  #! ring: bright blue
