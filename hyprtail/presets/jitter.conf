# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# doc: trail:fade_ms trail:spread
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Scattered dots around the trail (instanced, bounded offset)
layers      = trail

# source
source:min_spacing = 2    # smallest move that adds a point, px
source:max_spacing = 8    # largest gap between points, px; lower = smoother curves
source:warp_speed  = 17   # how fast a warp is drawn, px/ms
source:warp_max_ms = 250  # longest a warp takes to draw, ms
source:warp_p1     = 0,0  # warp easing curve, first control point x,y
source:warp_p2     = 1,1  # warp easing curve, second control point x,y

# trail
trail:vertex   = builtin:scatter.vert
trail:fragment = builtin:dots.frag
trail:fade_ms  = 500         # particle lifetime, ms
trail:copies   = 6           #! dots per trail point; cost is copies x points, keep it low with a long fade_ms
trail:size     = 2
trail:spread   = 6           # how far dots scatter from the trail, px
trail:color_a  = 0xffffffff  #! white dots, mixed at random with blue
trail:color_b  = 0xff1a66ff  #! blue dots, mixed at random with white
trail:softness = 0.6
