# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# variant: tail:speed_ref=1.5 | Flares amber on lighter movement
# doc: tail:fade_ms tail:width tail:speed_ref
# doc: sparks:fade_ms sparks:count sparks:shape
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Short tapered tail, ice blue flaring to amber, shedding sparks
layers      = sparks, tail

# source
source:min_spacing = 4      # smallest move that adds a point, px
source:max_spacing = 8      # largest gap between points, px; lower = smoother curves
source:warp_speed  = 4      # how fast a warp is drawn, px/ms
source:warp_max_ms = 300    # longest a warp takes to draw, ms
source:warp_p1     = 0.3,1  # warp easing curve, first control point x,y
source:warp_p2     = 0.2,1  # warp easing curve, second control point x,y

# tail
tail:vertex      = builtin:taper.vert
tail:fragment    = builtin:gradient.frag
tail:fade_ms     = 500         # tail length, ms
tail:width       = 7           # trail thickness at the head, px
tail:miter_limit = 2
tail:speed_ref   = 4           # speed for full color_b, px/ms; lower = flares sooner
tail:color_a     = 0xff4d8dff  #! slow: ice blue
tail:color_b     = 0xffffe27a  #! fast: amber flare

# sparks
sparks:vertex     = builtin:drift.vert
sparks:fragment   = builtin:dots.frag
sparks:fade_ms    = 1200        # particle lifetime, ms
sparks:count      = 4           # particles per trail point; higher = denser
sparks:size       = 4
sparks:speed      = 120
sparks:wobble     = 3
sparks:trailing   = 0.9
sparks:shape      = 2           # 0 = round dot, 1 = ring, 2 = four-point sparkle
sparks:softness   = 0.2
sparks:twinkle    = 0.5
sparks:twinkle_hz = 14
sparks:color_by   = 1
sparks:color_a    = 0xffffe27a  #! newborn spark
sparks:color_b    = 0xffff5a1a  #! dying spark
