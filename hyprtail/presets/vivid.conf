# --- common:start
# A built-in preset: trail = "builtin:<name>". To change it, copy it to
# ~/.config/hypr/hyprtail/presets/<name>.conf, edit the copy and set
# trail = "presets/<name>.conf" 
# Colors are 0xAARRGGBB or rgba(RRGGBBAA). 
# --- common:end

# variant: glow:width=40 core:width=6 | Wider glow, thicker core
# doc: glow:fade_ms glow:width glow:speed_ref
# doc: core:fade_ms core:width core:speed_ref
# doc: source:min_spacing source:max_spacing source:warp_speed source:warp_max_ms source:warp_p1 source:warp_p2

contract    = 2
description = Cyan-to-magenta ribbon with a soft wide glow underneath
layers      = glow, core

# source
source:min_spacing = 2    # smallest move that adds a point, px
source:max_spacing = 8    # largest gap between points, px; lower = smoother curves
source:warp_speed  = 4    # how fast a warp is drawn, px/ms
source:warp_max_ms = 250  # longest a warp takes to draw, ms
source:warp_p1     = 0,0  # warp easing curve, first control point x,y
source:warp_p2     = 1,1  # warp easing curve, second control point x,y

# glow
glow:vertex      = builtin:taper.vert
glow:fragment    = builtin:gradient.frag
glow:fade_ms     = 450         # tail length, ms
glow:width       = 26          # trail thickness at the head, px
glow:miter_limit = 2
glow:speed_ref   = 2           # speed for full color_b, px/ms; lower = flares sooner
glow:color_a     = 0x3300e5ff  #! slow: faint cyan glow
glow:color_b     = 0x33ff2bd6  #! fast: faint magenta glow

# core
core:vertex      = builtin:taper.vert
core:fragment    = builtin:gradient.frag
core:fade_ms     = 300         # tail length, ms
core:width       = 4           # trail thickness at the head, px
core:miter_limit = 2
core:speed_ref   = 2           # speed for full color_b, px/ms; lower = flares sooner
core:color_a     = 0xffa8f6ff  #! slow: pale cyan
core:color_b     = 0xffffa3ee  #! fast: pale pink
