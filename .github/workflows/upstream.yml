name: Upstream

# "Did upstream Hyprland break hyprtail?" Builds the unchanged master against
# Hyprland refs that move: Arch's current package, the latest release tag,
# the release branch when it is ahead of that tag, and main. Never on PRs and
# never required: a PR can't fix upstream drift. A red row means re-pin, add a
# hyprpm.toml commit_pins entry, or port (src/compat.hpp).
# main breaks far more often than the others, so it alerts in a tracking issue
# of its own: a red main must not hide a stable, release-branch or Arch
# regression in the same issue.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- resolve
  # The Nix rows: latest release tag, the release branch head if it is
  # ahead of the tag, and main. Read-only GitHub API calls with the default token. Each
  # ref is resolved to a commit here, once, and every step of the row builds
  # that commit: a ref that moves mid-run can't split a row across commits,
  # and the alert names the commit that was tested.
  resolve:
    name: resolve-hyprland-refs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Resolve stable tag, release branch, and main
        id: build-matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # v0.56.2 only builds under Nix with v0.56.1's nixpkgs (glaze
          # 7.9.0; v0.56.2's own lock has glaze 8, which its CMakeLists rejects). Only for this tag: a
          # newer release gets its own lock, unpinned, and the other rows are
          # never pinned (an honest failure there is information).
          pin_tag="v0.56.2"
          pin_nixpkgs="github:NixOS/nixpkgs/61b7c44c4073f0b827768aff0049561b5110ea5a"

          # Called as $(row ...), where errexit doesn't reach: check by hand.
          row() { # name ref [nixpkgs]
            local sha ov
            sha="$(gh api "repos/hyprwm/Hyprland/commits/$2" --jq .sha)" || return 1
            if [ -z "$sha" ]; then
              echo "::error::could not resolve Hyprland ref '$2'" >&2
              return 1
            fi
            ov="--override-input hyprland github:hyprwm/Hyprland/$sha --no-write-lock-file"
            if [ -n "${3:-}" ]; then
              ov="$ov --override-input hyprland/nixpkgs $3"
            fi
            jq -nc --arg name "$1" --arg ref "$2" --arg sha "$sha" --arg overrides "$ov" \
              '{name: $name, ref: $ref, sha: $sha, overrides: $overrides}'
          }

          stable="$(gh api repos/hyprwm/Hyprland/releases/latest --jq .tag_name)"
          stable_nixpkgs=""
          if [ "$stable" = "$pin_tag" ]; then
            stable_nixpkgs="$pin_nixpkgs"
          fi
          r="$(row stable "$stable" "$stable_nixpkgs")"
          rows="$(jq -c '[.]' <<<"$r")"

          # One `vX.Y.Z-b` branch per patch tag; a row only when it's ahead.
          branch="${stable}-b"
          ahead="$(gh api "repos/hyprwm/Hyprland/compare/${stable}...${branch}" --jq .ahead_by 2>/dev/null || echo 0)"
          if [ "${ahead:-0}" -gt 0 ]; then
            r="$(row release-branch "$branch")"
            rows="$(jq -c --argjson r "$r" '. + [$r]' <<<"$rows")"
          fi

          # main: never a nixpkgs override, main brings its own lock.
          r="$(row main main)"
          rows="$(jq -c --argjson r "$r" '. + [$r]' <<<"$rows")"

          echo "matrix=$rows" >> "$GITHUB_OUTPUT"
          {
            echo "### Hyprland refs this run"
            echo '```json'
            jq . <<<"$rows"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------- nix
  # hyprtail built against each row's Hyprland closure (`make all` under
  # mkHyprlandPlugin, the pkg-config mode hyprpm uses), the host-free tests,
  # and the nm import check against that row's (non-LTO) Hyprland binary.
  nix:
    needs: resolve
    name: upstream-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - id: nix
        uses: ./.github/actions/nix-setup
        with:
          cache-key-suffix: ${{ matrix.name }}
          cache-key-rev: ${{ matrix.sha }}

      # `legacyPackages.hyprland` is the derivation hyprtail builds against
      # (flake.nix), so Hyprland is built once per row.
      - name: Build Hyprland (${{ matrix.ref }})
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          set -euo pipefail
          echo "${{ matrix.name }} ${{ matrix.ref }} ${{ matrix.sha }}" > row.txt
          echo "Hyprland ${{ matrix.ref }} at \`${{ matrix.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          read -ra ov <<<"$OVERRIDES"
          nix build ".#legacyPackages.x86_64-linux.hyprland" -L --out-link hyprland-bin "${ov[@]}"

      - name: Build hyprtail
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          set -euo pipefail
          read -ra ov <<<"$OVERRIDES"
          nix build ".#hyprtail" -L --out-link plugin "${ov[@]}"

      - name: Unit and compat tests (checks.unit)
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          set -euo pipefail
          read -ra ov <<<"$OVERRIDES"
          nix build ".#checks.x86_64-linux.unit" -L --no-link "${ov[@]}"

      # Nix wraps bin/Hyprland in a shell script; the ELF is .Hyprland-wrapped.
      - name: nm import check
        run: |
          set -euo pipefail
          elf="hyprland-bin/bin/.Hyprland-wrapped"
          [ -f "$elf" ] || elf="hyprland-bin/bin/Hyprland"
          bash scripts/ci/check-imports.sh plugin/lib/libhyprtail.so "$elf"

      # For the alert job's issue body.
      - name: Upload resolved ref
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-${{ matrix.name }}
          path: row.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Nix store
        if: success()
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix.outputs.cache-key }}
          gc-max-store-size-linux: 5G

  # ------------------------------------------------------------------- arch
  # What hyprpm users on Arch get next: the live repos' Hyprland package, LTO
  # build included. Same script as ci.yml's arch-pin.
  arch:
    name: upstream-arch
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --cap-add=SYS_PTRACE
    steps:
      - name: Install packages from the live repos
        run: pacman -Syu --noconfirm --needed base-devel git hyprland glslang

      - uses: actions/checkout@v4

      - name: Build and test (scripts/ci/arch.sh)
        run: bash scripts/ci/arch.sh

      - name: Record package version
        if: always()
        run: echo "arch $(pacman -Q hyprland 2>/dev/null || echo 'hyprland not installed')" > row.txt

      - name: Upload resolved package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-arch
          path: row.txt
          retention-days: 14

  # ------------------------------------------------------------------ alert
  # Scheduled runs only. One open tracking issue per group: upstream-main for
  # the main row, the shared one for every other row. A comment only when the
  # group's set of failing rows changes, so a row that stays red doesn't
  # comment daily. A row that timed out or was cancelled alerts too: it tested
  # nothing, and a check that never finishes must not read as a pass.
  alert:
    if: always() && github.event_name == 'schedule'
    needs: [nix, arch]
    name: alert
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      # The refs only decorate the issue: a failed download must not stop it.
      - name: Download resolved refs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows

      - name: Open or update the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          all="$(gh api "repos/${REPO}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")
                  | "\(.name) (\(.conclusion))"' | sort)"
          main_failed="$(grep '^upstream-main ' <<<"$all" || true)"
          other_failed="$(grep -v '^upstream-main ' <<<"$all" || true)"
          # Each row.txt line starts with its row's name.
          refs="$(cat rows/*/row.txt 2>/dev/null || true)"
          main_refs="$(grep '^main ' <<<"$refs" || true)"
          other_refs="$(grep -v '^main ' <<<"$refs" || true)"

          # report title label color description failed-lines refs-lines
          report() {
            local title="$1" label="$2" color="$3" desc="$4" failed="$5" rows="$6"
            local marker issue last
            if [ -z "$failed" ]; then
              echo "$title: no failures"
              return 0
            fi
            marker="<!-- failed: $(tr '\n' ' ' <<<"$failed") -->"
            {
              echo "Scheduled run: ${RUN_URL}"
              echo
              echo "Failing:"
              sed 's/^/- /' <<<"$failed"
              echo
              echo "Refs this run (row, ref, commit or package):"
              sed '/^$/d; s/^/- /' <<<"$rows"
              echo
              echo "$marker"
            } > body.md

            gh label create "$label" --repo "$REPO" --force --color "$color" --description "$desc" || true
            issue="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
              --json number --jq '.[0].number // empty')"
            if [ -z "$issue" ]; then
              gh issue create --repo "$REPO" --title "$title" --label "$label" --body-file body.md \
                || gh issue create --repo "$REPO" --title "$title" --body-file body.md
              return 0
            fi
            last="$(gh issue view "$issue" --repo "$REPO" --json body,comments \
              --jq '([.body] + [.comments[].body]) | last')"
            if grep -qF "$marker" <<<"$last"; then
              echo "issue #$issue already reports this set of failures"
              return 0
            fi
            gh issue comment "$issue" --repo "$REPO" --body-file body.md
          }

          # The issue search matches title words, so neither title may
          # contain all the words of the other.
          report "Upstream Hyprland broke hyprtail" upstream-regression d73a4a \
            "Scheduled upstream CI caught a regression" "$other_failed" "$other_refs"
          report "Hyprland main: hyprtail build red" upstream-main fbca04 \
            "Scheduled CI against Hyprland main failed" "$main_failed" "$main_refs"
